# powerd.conf - UCLAMP 功耗自适应调度
# 适配 Kin 调度体系: 多SoC / 模式联动 / 场景策略 / 频率表
# 路径: /data/adb/modules/powerd_uclamp/powerd.conf

# --- 采样与日志 ---
INTERVAL=2
LOG_FILE=/data/local/tmp/powerd.log
LOG_LEVEL=2       # 0=关 1=切档 2=info 3=debug

# --- 功率阈值(W) ---
P_LOW=2.5
P_MID=5.0
P_HIGH=7.5
P_CRITICAL=9.5

# --- 温度阈值(°C) ---
T_WARN=43
T_HIGH=46
T_CRITICAL=49

# --- 模式联动: 读取 Kin 当前模式调整策略 ---
# Kin模式: balance(均衡)/performance(性能)/powersave(省电)/fast(极速)/game(游戏)
# powerd 根据模式偏移温度/功率阈值
MODE_FILE=/sdcard/Android/Kin/mode.txt
MODE_BALANCE=balance
MODE_PERF=performance
MODE_SAVE=powersave
MODE_FAST=fast

# --- SoC 专属频率表(从 Kin 配置提取) ---
# 格式: SoC代号=大核最高频:小核最高频:GPU最高频(Hz)
# 8E5 (SM8850/PLK110)
FREQ_8E5_BIG=3500000
FREQ_8E5_LITTLE=2200000
GPU_8E5=1100000000
GPU_8E5_HEAT=680000000
GPU_8E5_CRIT=460000000

# 8G3 (SM8650)
FREQ_8G3_BIG=3200000
FREQ_8G3_LITTLE=2200000
GPU_8G3=1000000000
GPU_8G3_HEAT=680000000
GPU_8G3_CRIT=460000000

# 8G2 (SM8550)
FREQ_8G2_BIG=3000000
FREQ_8G2_LITTLE=2000000
GPU_8G2=900000000
GPU_8G2_HEAT=600000000
GPU_8G2_CRIT=400000000

# 8E (SM8750)
FREQ_8E_BIG=4000000
FREQ_8E_LITTLE=2400000
GPU_8E=1200000000
GPU_8E_HEAT=680000000
GPU_8E_CRIT=460000000

# D9400 (MT6991)
FREQ_D9400_BIG=3300000
FREQ_D9400_LITTLE=2000000
GPU_D9400=950000000
GPU_D9400_HEAT=600000000
GPU_D9400_CRIT=400000000

# --- UCLAMP 值 (0-1024, 1024=100% capacity) ---
# L0 放开: 温和boost底线, 上限不限
UCLAMP_MIN_BOOST=128
UCLAMP_MAX_FULL=1024
# L1 温和: 不boost, cap 75%
UCLAMP_MAX_L1=768
# L2 深度: cap 50%
UCLAMP_MAX_L2=512
# L3 关核: cap 25% + 下线大核
UCLAMP_MAX_L3=256

# --- 场景策略: 模仿Kin的AutoMode app_policy ---
# 游戏: 全开不降
GAME_PKGS=com.tencent.tmgp.pubgmhd:com.miHoYo.Yuanshen:com.miHoYo.GenshinImpact:com.tencent.tmgp.sgame:com.netease.onmyoji:com.kwai.game
# 游戏模式下允许更高功率才降档
GAME_P_CRITICAL=10.5
GAME_T_WARN=46

# 相机: 保持中档
CAMERA_PKGS=com.android.camera:com.oplus.camera:org.codeaurora.snapcam

# 视频: 保持中低档
VIDEO_PKGS=com.mxtech.videoplayer.ad:com.google.android.youtube

# 社交: 保活不激进
SOCIAL_PKGS=com.tencent.mm:com.tencent.mobileqq:com.ss.android.ugc.aweme
